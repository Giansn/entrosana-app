# Seit 2026-11-05 liegt die echte DB auf Metanet; dort sichert Cron 03:20 nach
# hub.backup.sqlite. e14 holt die Sicherung an dieselbe Stelle wie früher, damit
# die bestehende Sicherungskette (Offsite 04:45) unverändert weiterläuft.
[Service]
ExecStart=
ExecStart=/usr/bin/rsync -t -e "ssh -o ConnectTimeout=30" metanet:entrosana-app/api/db/hub.backup.sqlite %h/entrosana-app/api/db/hub.backup.sqlite
ExecStartPost=/bin/sh -c 'test "$(sqlite3 %h/entrosana-app/api/db/hub.backup.sqlite "PRAGMA integrity_check")" = ok'
